<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Slinky">
    <meta name="description" content="The People you want to meet!">
    <title>Select Player</title>
    <link rel="icon" href="Pics/peai.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        .select-player-layout {
            display: flex;
            gap: 3rem;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .play-button {
            background-color:#1aba2c;
            color: #f5f5f5
        }

        .play-button:hover {
            background-color: #f9a8ff
        }

        .select-player-heading {
            text-align: center;
            font-size: 2.5rem;
            letter-spacing: 0.15em;
            padding: 1.5rem 0 0.5rem;
            max-width: 900px;
            margin: 0 auto;
            -webkit-text-stroke: 1px rgb(2, 71, 0);
        }

        .carousel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .carousel-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .carousel-arrow {
            background: none;
            border-radius: 2px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-arrow:hover {
            background-color: #f9a8ff;
        }

        .carousel-img-box {
            flex: 1;
            aspect-ratio: 5 / 7;
            border: 10px solid #9d6cff;
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f5f5f5;
        }

        .carousel-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .carousel-img-box img.active {
            display: block;
        }

        .carousel-img-box .img-placeholder {
            font-size: 14px;
            color: #999;
            text-align: center;
            padding: 1rem;
        }

        .carousel-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f9a8ff;
            cursor: pointer;
            border: none;
        }

        .dot.active {
            background: #9d6cff;
        }

        .info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.2rem;
        }

        .player-name {
            font-size: 2rem;
            margin: 0;
        
        }

        .player-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-stat label {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #000000;
        }

        .player-stat span {
            font-size: 20px;
            margin: 0;
            color: #9d6cff
        }

        .player-likes {
            font-size: 20px;
            margin: 0;
            color: #9d6cff
        }

        .player-weakness {
            font-size: 20px;
            margin: 0;
            color: #9d6cff
        }
    </style>
</head>

<body class="aboutus">
    <a href="index.html"><img class="sspp" src="Pics/bandaid.gif" alt="bandaid"></a>

    <div class="select-player-heading"><span>SELECT</span><br><span>PLAYER</span></div>
    <div class="select-player-layout">

        <div class="carousel-section">
            <div class="carousel-row">
                <button class="carousel-arrow" id="prev-btn" aria-label="Previous player">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <polygon points="18,3 18,21 4,12" fill="#9d6cff" stroke="#9d6cff" stroke-width="3" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="carousel-img-box" id="carousel-img-box">
                    <img src="Pics/dunc_player.png" alt="Player 1" class="active">
                    <img src="Pics/eric_player.png" alt="Player 2">
                    <img src="Pics/gardo_player.png" alt="Player 3">
                    <img src="Pics/matt_player.png" alt="Player 4">
                    <img src="Pics/phil_player.png" alt="Player 5">
                    <img src="Pics/brandon_player.png" alt="Player 6">
                </div>
                <button class="carousel-arrow" id="next-btn" aria-label="Next player">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <polygon points="6,3 6,21 20,12" fill="#9d6cff" stroke="#9d6cff" stroke-width="3" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="carousel-dots" id="dots"></div>
        </div>

        <div class="info-section">
            <h2 class="player-name" id="p-name">Duncan Pickett</h2>
            <div class="player-stat">
                <label>Age</label>
                <span id="p-age">unknown</span>
            </div>
            <div class="player-stat">
                <label>Instrument</label>
                <span id="p-instrument">Saxophone</span>
            </div>
            <div class="player-stat">
                <label>Likes</label>
                <p class="player-likes" id="p-likes">Sidewalks, New York, Food</p>
            </div>
            <div class="player-stat">
                <label>Weakness</label>
                <p class="player-weakness" id="p-weakness">Cars</p>
            </div>

            <div style="text-align: center;">
                <a href="game.html"><button class="play-button">PLAY</button></a>
            </div>

        </div>

    </div>

    <script>
        const members = [
            {
                name: "Duncan Pickett",
                age: "unknown",
                instrument: "Saxophone",
                likes: "Sidewalks, New York, Food",
                weakness: "Cars"
            },
            {
                name: "Eric Chang",
                age: 31,
                instrument: "Percussion",
                likes: "Skateboarding, sci-fi novels, black coffee",
                weakness: "Bars"
            },
            {
                name: "Gardo",
                age: 25,
                instrument: "Piano",
                likes: "Wires, Mrs Gardo, documentary films",
                weakness: "Tangled cables"
            },
            {
                name: "Matthew Decker",
                age: 26,
                instrument: "Bass",
                likes: "Bass, motorcycles, spaghetti",
                weakness: "Wars"
            },
            {
                name: "Phillip Chu",
                age: 27,
                instrument: "Vocals, Violin",
                likes: "Karaoke, road trips, articles",
                weakness: "Jars"
            },
            {
                name: "Brando",
                age: "29",
                instrument: "Guitar",
                likes: "loud noises, strange noises, guitar pedals",
                weakness: "guitar pedals"
            },
        ];

        let current = 0;
        const images = document.querySelectorAll('.carousel-img-box img');
        const dotsContainer = document.getElementById('dots');

        members.forEach(function(_, i) {
            const dot = document.createElement('button');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('aria-label', 'Go to player ' + (i + 1));
            dot.addEventListener('click', function() { goTo(i); });
            dotsContainer.appendChild(dot);
        });

        function goTo(index) {
            current = (index + members.length) % members.length;
            const m = members[current];

            document.getElementById('p-name').textContent = m.name;
            document.getElementById('p-age').textContent = m.age;
            document.getElementById('p-instrument').textContent = m.instrument;
            document.getElementById('p-likes').textContent = m.likes;
            document.getElementById('p-weakness').textContent = m.weakness;

            images.forEach(function(img, i) {
                img.classList.toggle('active', i === current);
            });

            document.querySelectorAll('.dot').forEach(function(dot, i) {
                dot.classList.toggle('active', i === current);
            });
        }

        document.getElementById('prev-btn').addEventListener('click', function() { goTo(current - 1); });
        document.getElementById('next-btn').addEventListener('click', function() { goTo(current + 1); });
    </script>

</body>
</html>
